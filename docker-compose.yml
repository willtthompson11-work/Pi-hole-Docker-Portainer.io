### File 2: `docker-compose.yml`
Even though we launched the containers using imperative `docker run` commands today[cite: 3], including an equivalent `docker-compose.yml` file in your repo shows Infrastructure-as-Code (IaC) best practices:

```yaml
services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
    environment:
      TZ: 'America/Phoenix'
      WEBPASSWORD: '${PIHOLE_PASSWORD:-ChangeMeInEnvFile}'
      DNSMASQ_LISTENING: 'all'
    volumes:
      - pihole_etc:/etc/pihole
      - pihole_dnsmasq:/etc/dnsmasq.d

volumes:
  portainer_data:
  pihole_etc:
  pihole_dnsmasq:
